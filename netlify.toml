# Netlify reads this file from the repository root, or from the base directory
# if one is set in the site UI. Keep it in sync with the UI's "Base directory"
# setting: if the UI sets one, this file must live there instead.
[build]
  base = "Frontend"
  # Netlify installs dependencies itself before running this, so no npm ci here.
  command = "npm run build"
  # Relative to `base`, i.e. Frontend/dist.
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "https://react-node-url-metadata-fetcher.onrender.com"

# Single-page app: every path serves index.html. Duplicated in
# Frontend/public/_redirects, which Netlify reads from the published output
# regardless of how the build was configured.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
